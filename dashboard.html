<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Screen — Device Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0f1e;
    color: #e2e8f0;
    font-family: 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border-bottom: 1px solid #22c55e33;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { color: #22c55e; font-size: 20px; }
  .header span { color: #64748b; font-size: 13px; }

  /* ── Stats cards ── */
  .stats {
    display: flex;
    gap: 16px;
    padding: 24px 30px 0;
  }
  .card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 18px 24px;
    flex: 1;
    text-align: center;
  }
  .card .num  { font-size: 32px; font-weight: bold; color: #22c55e; }
  .card .lbl  { font-size: 12px; color: #64748b; margin-top: 4px; }

  /* ── Table ── */
  .table-wrap {
    padding: 24px 30px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: #0f172a;
    color: #22c55e;
    padding: 12px 14px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid #22c55e44;
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid #1e293b;
    transition: background .15s;
  }
  tbody tr:hover { background: #1e293b; }
  tbody td {
    padding: 11px 14px;
    color: #cbd5e1;
    white-space: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-bd  { background: #166534; color: #86efac; }
  .badge-in  { background: #7c3aed; color: #c4b5fd; }
  .badge-us  { background: #1d4ed8; color: #93c5fd; }
  .badge-def { background: #374151; color: #9ca3af; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 30px 16px;
  }
  input[type=text] {
    background: #0f172a;
    border: 1px solid #1e293b;
    color: #e2e8f0;
    padding: 8px 14px;
    border-radius: 7px;
    font-size: 13px;
    width: 260px;
    outline: none;
  }
  input[type=text]:focus { border-color: #22c55e; }
  button {
    background: #22c55e;
    color: #000;
    border: none;
    padding: 8px 18px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #16a34a; }
  .btn-del {
    background: #dc2626;
    color: #fff;
  }
  .btn-del:hover { background: #b91c1c; }

  .status {
    color: #64748b;
    font-size: 12px;
    margin-left: auto;
  }
  .live-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #22c55e;
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50%      { opacity: .3; }
  }

  .empty {
    text-align: center;
    color: #334155;
    padding: 60px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🖥️ Black Screen — Device Tracker</h1>
  <span id="lastUpdate">Last update: —</span>
</div>

<div class="stats">
  <div class="card">
    <div class="num" id="totalCount">0</div>
    <div class="lbl">Total Devices</div>
  </div>
  <div class="card">
    <div class="num" id="countryCount">0</div>
    <div class="lbl">Countries</div>
  </div>
  <div class="card">
    <div class="num" id="todayCount">0</div>
    <div class="lbl">Today</div>
  </div>
  <div class="card">
    <div class="num" id="uniqueIp">0</div>
    <div class="lbl">Unique IPs</div>
  </div>
</div>

<div class="table-wrap">
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍  PC name, IP, country..." oninput="filterTable()">
    <button onclick="loadData()">🔄 Refresh</button>
    <span class="status"><span class="live-dot"></span>Live</span>
  </div>

  <table id="devTable">
    <thead>
      <tr>
        <th>#</th>
        <th>PC Name</th>
        <th>Username</th>
        <th>IP Address</th>
        <th>Country</th>
        <th>City</th>
        <th>ISP / Org</th>
        <th>Date & Time</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="8" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>

<script>
// ════════════════════════════════════════════════════
// ★ আপনার Firebase URL এখানে বসান ★
const FIREBASE_URL = "https://test-mode-60dd1-default-rtdb.firebaseio.com";
// ════════════════════════════════════════════════════

let allRows = [];

async function loadData() {
  try {
    const res  = await fetch(FIREBASE_URL + "/devices.json");
    const data = await res.json();
    if (!data) { renderEmpty(); return; }

    allRows = Object.values(data);
    renderTable(allRows);
    updateStats(allRows);

    document.getElementById('lastUpdate').textContent =
      'Last update: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="8" class="empty">❌ Firebase connection error.<br>Check your FIREBASE_URL.</td></tr>';
  }
}

function renderTable(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) { renderEmpty(); return; }

  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>💻 ${r.pcName   || '—'}</td>
      <td>👤 ${r.userName || '—'}</td>
      <td>🌐 ${r.ip       || '—'}</td>
      <td><span class="badge ${badgeClass(r.country)}">${r.country || '—'}</span></td>
      <td>${r.city || '—'}</td>
      <td>${r.org  || '—'}</td>
      <td>🕐 ${r.time || '—'}</td>
    </tr>
  `).join('');
}

function renderEmpty() {
  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="8" class="empty">No devices found yet.</td></tr>';
}

function updateStats(rows) {
  document.getElementById('totalCount').textContent   = rows.length;
  document.getElementById('countryCount').textContent = new Set(rows.map(r => r.country)).size;
  document.getElementById('uniqueIp').textContent     = new Set(rows.map(r => r.ip)).size;

  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('todayCount').textContent =
    rows.filter(r => r.time && r.time.startsWith(today)).length;
}

function filterTable() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = allRows.filter(r =>
    (r.pcName   || '').toLowerCase().includes(q) ||
    (r.ip       || '').toLowerCase().includes(q) ||
    (r.country  || '').toLowerCase().includes(q) ||
    (r.city     || '').toLowerCase().includes(q) ||
    (r.userName || '').toLowerCase().includes(q)
  );
  renderTable(filtered);
}

function badgeClass(c) {
  if (!c) return 'badge-def';
  if (c === 'BD') return 'badge-bd';
  if (c === 'IN') return 'badge-in';
  if (c === 'US') return 'badge-us';
  return 'badge-def';
}

// Auto-refresh every 30 seconds
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
